name: Release All Missing

# The same build as release-all.yml (build.yml) over only what the release does NOT have: a platform counts
# as present only when BOTH wt-<platform>.tar.gz and its .sha256sum are on the release, because a tarball
# whose checksum upload failed is exactly the half-published state this repairs. A platform that is missing
# and does not build stays missing - its log says why - and does not fail the run.
#
# Usage:  gh workflow run release-all-missing.yml -f version=v0.01

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to complete, e.g. v0.01'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wt-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      only: ${{ steps.plan.outputs.only }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          assets="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"
          missing=""
          for p in $(jq -r '.[].platform' platforms.json); do
            echo "$assets" | grep -qx "wt-$p.tar.gz" && echo "$assets" | grep -qx "wt-$p.tar.gz.sha256sum" || missing="$missing $p"
          done
          missing="$(echo $missing)"
          echo "only=$missing" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$missing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "missing: ${missing:-nothing}"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      contents: write
