name: Release All

# Builds wt - the reader of raw MongoDB data files that migrates a MongoDB 3.0 - 8.x database to FerretDB
# (SQLite) WITHOUT mongod - for every platform in platforms.json (the platforms of wekan/node-patches),
# and attaches wt-<platform>.tar.gz and its .sha256sum to the GitHub Release. WeKan's workflows download
# the newest of these from https://github.com/wekan/wt/releases, the way they take node-patches and
# mongo-tools-patches binaries. The build steps are in build.yml.
#
# Usage:  gh workflow run release-all.yml -f version=v0.01

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create or update, e.g. v0.01'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wt-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: write
